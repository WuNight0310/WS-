name: Build Pure Python WS Master Duel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 (Required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Clean Non-ASCII Desktop Helper Files, Convert WebP/MP3 & Bundle Full Font
        run: |
          rm -rf android_apk_builder ws_master_duel_web_mobile.html artifacts
          rm -f *.bat *.zip win32_ico_builder.py ws_card_images/*.txt
          python -c '
          import os
          for fn in os.listdir("."):
              if not fn.isascii() and (fn.endswith(".py") or fn.endswith(".bat") or fn.endswith(".zip")):
                  os.remove(fn)
                  print("Removed desktop-only file:", fn)
          '
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config ffmpeg \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake libltdl-dev libjpeg-dev libpng-dev \
            libfreetype6-dev fonts-wqy-microhei fonts-wqy-zenhei

          # Bundle WQY MicroHei (contains BOTH full ASCII A-Z/0-9 AND Traditional/Simplified Chinese + Japanese!)
          if [ -f "/usr/share/fonts/truetype/wqy/wqy-microhei.ttc" ]; then
            cp "/usr/share/fonts/truetype/wqy/wqy-microhei.ttc" ./ws_font.ttf
          elif [ -f "/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc" ]; then
            cp "/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc" ./ws_font.ttf
          fi

          # Convert ws_audio/*.mp3 to 22.05kHz PCM .wav for 100% Android SDL2_mixer compatibility, and remove duplicate .mp3 in CI
          if [ -d "ws_audio" ]; then
            for mp3 in ws_audio/*.mp3; do
              if [ -f "$mp3" ]; then
                wav_out="${mp3%.mp3}.wav"
                if ffmpeg -y -i "$mp3" -ar 22050 -ac 1 "$wav_out" >/dev/null 2>&1; then
                  rm -f "$mp3"
                  echo "Converted $mp3 -> $wav_out (removed duplicate .mp3 to keep APK compact)"
                fi
              fi
            done
          fi

          python -m pip install --upgrade pip "setuptools<70" "wheel" "cython==0.29.36" "buildozer==1.5.0" virtualenv pillow

          # Convert bundled ws_card_images/*.webp to optimized .jpg so APK stays compact (~45MB instead of 300MB+)
          python -c '
          from PIL import Image, ImageFont
          import glob, os
          if os.path.exists("ws_font.ttf"):
              f = ImageFont.truetype("ws_font.ttf", 20)
              notdef = list(f.getmask("\ufffd"))
              print("Font check -> A:", list(f.getmask("A")) != notdef, "0:", list(f.getmask("0")) != notdef, "卡:", list(f.getmask("卡")) != notdef)
          converted = 0
          for wp in glob.glob("ws_card_images/*.webp"):
              jp = wp[:-5] + ".jpg"
              try:
                  im = Image.open(wp).convert("RGB")
                  bname = os.path.basename(wp).lower()
                  if "sleeve" in bname:
                      im.thumbnail((480, 672))
                      im.save(jp, "JPEG", quality=90, optimize=True)
                  else:
                      im.thumbnail((320, 448))
                      im.save(jp, "JPEG", quality=82, optimize=True)
                  os.remove(wp)
                  converted += 1
              except Exception as e:
                  print("Skip webp:", wp, e)
          print(f"Converted & optimized {converted} .webp images to .jpg for Android Pillow 8.4.0")
          '

      - name: Restore Buildozer Cache (SDK/NDK & Compiled Python 3.11)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer/android/platform
          key: ws-pure-py311-p4a-v9-${{ runner.os }}
          restore-keys: |
            ws-pure-py311-p4a-v9-
            ws-pure-py311-p4a-v8-
            ws-pure-py311-p4a-v7-
            ws-pure-py311-p4a-v6-

      - name: Provision Android SDK 33, Build-Tools 33.0.2 & Gradle 4GB Heap
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SYS_SDK="/usr/local/lib/android/sdk"
          mkdir -p "$SDK_DIR/build-tools" "$SDK_DIR/platforms" "$SDK_DIR/licenses"

          if [ -d "$SYS_SDK/platform-tools" ] && [ ! -d "$SDK_DIR/platform-tools" ]; then
            cp -r "$SYS_SDK/platform-tools" "$SDK_DIR/"
          fi
          if [ -d "$SYS_SDK/platforms/android-33" ] && [ ! -d "$SDK_DIR/platforms/android-33" ]; then
            cp -r "$SYS_SDK/platforms/android-33" "$SDK_DIR/platforms/"
          fi
          for bt in "$SYS_SDK/build-tools/33."* "$SYS_SDK/build-tools/34."*; do
            if [ -d "$bt" ]; then
              cp -rn "$bt" "$SDK_DIR/build-tools/" || true
            fi
          done

          SYS_SDKMGR=$(find "$SYS_SDK/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SYS_SDKMGR" ]; then
            set +o pipefail
            yes | "$SYS_SDKMGR" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
            yes | "$SYS_SDKMGR" --sdk_root="$SDK_DIR" --licenses || true
            set -o pipefail
          fi
          if [ -d "$SYS_SDK/licenses" ]; then
            cp -rn "$SYS_SDK/licenses/"* "$SDK_DIR/licenses/" 2>/dev/null || true
          fi

          if ls -d "$SDK_DIR/build-tools/33."* "$SDK_DIR/build-tools/34."* >/dev/null 2>&1; then
            rm -rf "$SDK_DIR/build-tools/35"* "$SDK_DIR/build-tools/36"* "$SDK_DIR/build-tools/37"*
            if ls -d "$SDK_DIR/build-tools/33."* >/dev/null 2>&1; then
              rm -rf "$SDK_DIR/build-tools/34"*
            fi
          fi

          find .buildozer -path "*charset_normalizer*" -name "*.so" -delete 2>/dev/null || true
          # Always wipe stale .buildozer/android/app so buildozer never packages old cached .py files
          rm -rf .buildozer/android/app bin/*.apk

          mkdir -p "$HOME/.gradle"
          cat << 'EOF' > "$HOME/.gradle/gradle.properties"
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=33,34,35
          EOF

          rm -rf .buildozer/android/platform/build-arm64-v8a/dists/wsmasterduel/build
          rm -rf .buildozer/android/platform/build-arm64-v8a/dists/wsmasterduel/.gradle

      - name: Compile Pure Python APK & Force-Inject Latest Code/Assets into private.mp3
        run: |
          echo "Using JAVA_HOME=$JAVA_HOME"
          java -version
          export GRADLE_OPTS="-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8'"

          DIST_DIR=".buildozer/android/platform/build-arm64-v8a/dists/wsmasterduel"

          # Only run full buildozer if the p4a distribution folder does not exist in cache yet
          if [ ! -d "$DIST_DIR" ] || [ -z "$(find "$DIST_DIR" -name 'private.mp3' 2>/dev/null)" ]; then
            echo "=== Running initial Buildozer p4a compilation ==="
            set +e
            set +o pipefail
            yes | buildozer android debug > buildozer.log 2>&1 &
            BPID=$!
            while kill -0 $BPID 2>/dev/null; do
              sleep 10
            done
            wait $BPID
            set -e
            set -o pipefail
          else
            echo "=== Cached p4a dist found at $DIST_DIR! Proceeding directly to Force-Inject latest code & assets ==="
          fi

          # UNCONDITIONALLY inject the latest main.py, engine.py, network.py, tk_android_bridge.py, sets/, ws_card_images/, ws_audio/
          # into $DIST_DIR/**/private.mp3 AND bump private_version in strings.xml so Android ALWAYS unpacks the new code on launch!
          python - << 'PYEOF'
          import os, re, glob, shutil, tarfile, time, py_compile, subprocess

          dist = ".buildozer/android/platform/build-arm64-v8a/dists/wsmasterduel"
          assert os.path.isdir(dist), f"Dist directory missing: {dist}"

          # 1. Find hostpython3 (if available) to compile .pyc with exact target magic number
          host_py_list = glob.glob(".buildozer/**/hostpython3/native-build/python3", recursive=True)
          host_py = host_py_list[0] if host_py_list else "python3"
          print("Using Python compiler for .pyc:", host_py)

          mp3_files = glob.glob(os.path.join(dist, "**", "private.mp3"), recursive=True)
          assert mp3_files, f"No private.mp3 found under {dist}!"

          for mp3_path in mp3_files:
              mp3_abs = os.path.abspath(mp3_path)
              print("=== Force-syncing latest repo code & assets into:", mp3_path)
              sync_dir = "/tmp/p4a_private_sync"
              shutil.rmtree(sync_dir, ignore_errors=True)
              os.makedirs(sync_dir, exist_ok=True)

              with tarfile.open(mp3_abs, "r:gz") as tf:
                  tf.extractall(sync_dir)

              # Remove old cached app scripts, bytecode, and asset directories
              for old_f in ("main.py", "main.pyc", "engine.py", "engine.pyc", "network.py", "network.pyc", "tk_android_bridge.py", "tk_android_bridge.pyc", "ws_font.ttf", "maple_icon.png", "user_settings.json"):
                  p = os.path.join(sync_dir, old_f)
                  if os.path.exists(p):
                      os.remove(p)
              for old_d in ("sets", "ws_card_images", "ws_audio", "__pycache__"):
                  shutil.rmtree(os.path.join(sync_dir, old_d), ignore_errors=True)

              # Copy fresh Python files & compile fresh .pyc
              for py_f in ("main.py", "engine.py", "network.py", "tk_android_bridge.py"):
                  dst_py = os.path.join(sync_dir, py_f)
                  shutil.copy2(py_f, dst_py)
                  subprocess.run([host_py, "-c", f"import py_compile; py_compile.compile(r'{dst_py}', cfile=r'{dst_py}c', doraise=True)"], check=True)
                  print(f"  Injected & compiled {py_f} ({os.path.getsize(dst_py)} bytes) + {py_f}c ({os.path.getsize(dst_py + 'c')} bytes)")

              # Copy fresh fonts, icons, settings, and asset folders
              for asset_f in ("ws_font.ttf", "maple_icon.png", "user_settings.json", "custom_deck.json", "custom_decks_book.json"):
                  if os.path.isfile(asset_f):
                      shutil.copy2(asset_f, os.path.join(sync_dir, asset_f))

              for asset_d in ("sets", "ws_card_images", "ws_audio"):
                  if os.path.isdir(asset_d):
                      dst_d = os.path.join(sync_dir, asset_d)
                      shutil.copytree(asset_d, dst_d, dirs_exist_ok=True)
                      print(f"  Injected directory {asset_d}/ ({len(os.listdir(dst_d))} files)")

              # Repack private.mp3
              os.remove(mp3_abs)
              subprocess.run(["tar", "-czf", mp3_abs, "-C", sync_dir, "."], check=True)
              print(f"=== Repacked {mp3_path}: {os.path.getsize(mp3_abs)} bytes ===")

          # 2. Update private_version in strings.xml so Android PythonActivity ALWAYS wipes old phone data/app and extracts the new private.mp3!
          new_priv_ver = f"v2.5-{int(time.time())}"
          for sxml in glob.glob(os.path.join(dist, "**", "strings.xml"), recursive=True):
              with open(sxml, "r", encoding="utf-8") as f:
                  stxt = f.read()
              stxt_new = re.sub(
                  r'(<string name="private_version">)[^<]*(</string>)',
                  rf'\g<1>{new_priv_ver}\g<2>',
                  stxt,
              )
              with open(sxml, "w", encoding="utf-8") as f:
                  f.write(stxt_new)
              print(f"Updated private_version -> {new_priv_ver} in {sxml}")

          # 3. Patch AndroidManifest.xml (fullSensor auto-rotation + allowBackup=false + new versionCode)
          new_vcode = str(int(time.time()) // 10)
          for mf in glob.glob(os.path.join(dist, "**", "AndroidManifest*.xml"), recursive=True):
              try:
                  with open(mf, "r", encoding="utf-8") as f:
                      mtxt = f.read()
                  mtxt = re.sub(r'android:screenOrientation="[^"]+"', 'android:screenOrientation="fullSensor"', mtxt)
                  mtxt = re.sub(r'android:allowBackup="true"', 'android:allowBackup="false"', mtxt)
                  mtxt = re.sub(r'android:versionCode="[^"]+"', f'android:versionCode="{new_vcode}"', mtxt)
                  mtxt = re.sub(r'android:versionName="[^"]+"', 'android:versionName="2.5.0"', mtxt)
                  with open(mf, "w", encoding="utf-8") as f:
                      f.write(mtxt)
                  print("Patched manifest:", mf)
              except Exception as e:
                  print("Manifest patch warning:", mf, e)

          # 4. Patch build.gradle and gradle.properties
          sdk_dir = os.path.expanduser("~/.buildozer/android/platform/android-sdk")
          bts = sorted(os.listdir(os.path.join(sdk_dir, "build-tools"))) if os.path.isdir(os.path.join(sdk_dir, "build-tools")) else ["33.0.2"]
          bt_ver = bts[-1] if bts else "33.0.2"

          bg_path = os.path.join(dist, "build.gradle")
          if os.path.isfile(bg_path):
              with open(bg_path, "r", encoding="utf-8") as f:
                  bg = f.read()
              bg = re.sub(r"buildToolsVersion\s+[\x27\"][^\x27\"]+[\x27\"]", f"buildToolsVersion \x27{bt_ver}\x27", bg)
              if "noCompress" not in bg:
                  bg = bg.replace("android {", "android {\n    aaptOptions {\n        noCompress \x27tar\x27, \x27mp3\x27, \x27wav\x27, \x27so\x27\n    }")
              with open(bg_path, "w", encoding="utf-8") as f:
                  f.write(bg)

          gp_path = os.path.join(dist, "gradle.properties")
          with open(gp_path, "w", encoding="utf-8") as f:
              f.write("org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\n")
              f.write("android.useAndroidX=true\n")
              f.write("android.enableJetifier=true\n")
              f.write("android.suppressUnsupportedCompileSdk=33,34,35\n")
          PYEOF

          chmod +x "$DIST_DIR/gradlew"
          (cd "$DIST_DIR" && ./gradlew clean assembleDebug --stacktrace --no-daemon)
          mkdir -p bin dist_apk
          cp "$DIST_DIR"/build/outputs/apk/debug/*.apk bin/
          cp "$DIST_DIR"/build/outputs/apk/debug/*.apk dist_apk/WS_MasterDuel_PurePython.apk
          ls -lh dist_apk/

      - name: Publish Direct .APK to GitHub Releases (No Unzip Required on Mobile!)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "WS Master Duel Android APK v2.5 (最新版免解壓直接下載)"
          body: "手機請直接點擊下方 Assets 的 WS_MasterDuel_PurePython.apk 即可免解壓縮直接下載安裝！"
          files: dist_apk/WS_MasterDuel_PurePython.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Fallback CLI Release Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest
          git push -f origin latest || true
          gh release create latest dist_apk/WS_MasterDuel_PurePython.apk \
            --title "WS Master Duel Android APK v2.5 (最新版免解壓直接下載)" \
            --notes "手機直接點擊下方 WS_MasterDuel_PurePython.apk 即可免解壓縮直接下載安裝！" || \
          gh release upload latest dist_apk/WS_MasterDuel_PurePython.apk --clobber || true

      - name: Always Save Buildozer Cache (Even If Interrupted)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer/android/platform
          key: ws-pure-py311-p4a-v9-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WS_MasterDuel_Android_APK
          path: dist_apk/WS_MasterDuel_PurePython.apk
          compression-level: 6
          if-no-files-found: error
