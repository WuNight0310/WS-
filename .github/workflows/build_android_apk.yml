name: Build Pure Python WS Master Duel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Legacy Web Wrapper If Present
        run: |
          rm -rf android_apk_builder ws_master_duel_web_mobile.html

      - name: Install Buildozer & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake libltdl-dev fonts-noto-cjk
          pip3 install --upgrade pip "cython<3.0" buildozer virtualenv

      - name: Bundle Traditional Chinese Font Fallback
        run: |
          if [ -f "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc" ]; then
            cp "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc" ./ws_font.ttc
          fi

      - name: Cache Buildozer Android SDK/NDK & Python Distribution
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ws-pure-python-p4a-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ws-pure-python-p4a-v3-
            ws-pure-python-p4a-v2-

      - name: Compile Pure Python APK (main.py + engine.py + tk_android_bridge.py)
        run: |
          set +o pipefail
          yes | buildozer android debug
          set -o pipefail
          mkdir -p dist_apk
          cp bin/*.apk dist_apk/WS_MasterDuel_PurePython.apk
          ls -lh dist_apk/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WS_MasterDuel_Android_APK
          path: dist_apk/WS_MasterDuel_PurePython.apk
          if-no-files-found: error
