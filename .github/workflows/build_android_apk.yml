name: Build Android APK (WS Master Duel 16x9 Landscape)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Bundle Card Images, Lock Immersive Landscape & Inject Maple APK Icon
        working-directory: ./android_apk_builder
        run: |
          # 1. Copy local ws_card_images into www/ws_card_images so the APK has 100% built-in offline images
          mkdir -p www/ws_card_images
          if [ -d "../ws_card_images" ]; then
            cp -r ../ws_card_images/* www/ws_card_images/ || true
          fi
          npm install
          npx cap add android
          # 2. Force Landscape orientation in AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          # 3. Enable Android Immersive Sticky Fullscreen (hide status bar & bottom navigation bar) in MainActivity.java
          python3 -m pip install pillow
          python3 - << 'PY'
          import os, glob, shutil
          from PIL import Image

          for ma_path in glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True):
              with open(ma_path, "r", encoding="utf-8") as f:
                  code = f.read()
              if "SYSTEM_UI_FLAG_IMMERSIVE_STICKY" not in code:
                  immersive_hook = '''
    @Override
    public void onWindowFocusChanged(boolean hasFocus) {
        super.onWindowFocusChanged(hasFocus);
        if (hasFocus) {
            getWindow().getDecorView().setSystemUiVisibility(
                android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                | android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
            );
        }
    }
}'''
                  idx = code.rfind("}")
                  if idx != -1:
                      code = code[:idx] + immersive_hook
                      with open(ma_path, "w", encoding="utf-8") as f:
                          f.write(code)
                      print("Patched MainActivity.java for Immersive Sticky Fullscreen!")

          src_icon = "../maple_icon.png" if os.path.exists("../maple_icon.png") else ("../maple_angel_icon.png" if os.path.exists("../maple_angel_icon.png") else "")
          res_dir = "android/app/src/main/res"
          if src_icon and os.path.exists(res_dir):
              im = Image.open(src_icon).convert("RGBA")
              anydpi = os.path.join(res_dir, "mipmap-anydpi-v26")
              if os.path.exists(anydpi):
                  shutil.rmtree(anydpi)
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              for folder, px in sizes.items():
                  f_path = os.path.join(res_dir, folder)
                  os.makedirs(f_path, exist_ok=True)
                  resized = im.resize((px, px), Image.Resampling.LANCZOS)
                  for fn in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                      resized.save(os.path.join(f_path, fn), format="PNG")
              print("Successfully injected Maple icon into all Android APK mipmap folders!")
          PY
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Upload Compiled Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WS_MasterDuel_Android_APK
          path: android_apk_builder/android/app/build/outputs/apk/debug/app-debug.apk
