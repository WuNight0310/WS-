name: Build Pure Python WS Master Duel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 (Required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Clean Non-ASCII Desktop Helper Files & Bundle CJK Font
        run: |
          rm -rf android_apk_builder ws_master_duel_web_mobile.html artifacts
          rm -f *.bat win32_ico_builder.py ws_card_images/*.txt
          python -c '
          import os
          for fn in os.listdir("."):
              if not fn.isascii() and (fn.endswith(".py") or fn.endswith(".bat")):
                  os.remove(fn)
                  print("Removed desktop-only non-ASCII file:", fn)
          '
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake libltdl-dev libjpeg-dev libpng-dev \
            libfreetype6-dev fonts-droid-fallback
          if [ -f "/usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf" ]; then
            cp "/usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf" ./ws_font.ttf
          fi
          python -m pip install --upgrade pip "setuptools<70" "wheel" "cython==0.29.36" "buildozer==1.5.0" virtualenv

      - name: Restore Buildozer Cache (SDK/NDK & Compiled Python 3.11)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer/android/platform
          key: ws-pure-py311-p4a-v7-${{ runner.os }}
          restore-keys: |
            ws-pure-py311-p4a-v7-
            ws-pure-py311-p4a-v6-
            ws-pure-py311-p4a-v5-

      - name: Lock Android SDK Build-Tools to 33.0.2 (Prevent Broken 37.0.0)
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK_DIR" ]; then
            echo "Found cached Android SDK at $SDK_DIR, locking build-tools to 33.0.2..."
            rm -rf "$SDK_DIR/build-tools/34"* "$SDK_DIR/build-tools/35"* "$SDK_DIR/build-tools/36"* "$SDK_DIR/build-tools/37"*
            # sdkmanager in tools/bin requires Java 8 to run
            JAVA8_DIR="${JAVA_HOME_8_X64:-/usr/lib/jvm/temurin-8-jdk-amd64}"
            if [ -x "$SDK_DIR/tools/bin/sdkmanager" ]; then
              set +o pipefail
              JAVA_HOME="$JAVA8_DIR" PATH="$JAVA8_DIR/bin:$PATH" yes | "$SDK_DIR/tools/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
              JAVA_HOME="$JAVA8_DIR" PATH="$JAVA8_DIR/bin:$PATH" yes | "$SDK_DIR/tools/bin/sdkmanager" --licenses || true
              set -o pipefail
            fi
            ls -la "$SDK_DIR/build-tools/" || true
            if [ -d "$SDK_DIR/build-tools/33.0.2" ]; then
              python -c '
          with open("buildozer.spec", "r") as f:
              s = f.read()
          if "android.skip_update" not in s:
              s = s.replace("android.accept_sdk_license = True", "android.accept_sdk_license = True\nandroid.skip_update = True")
          with open("buildozer.spec", "w") as f:
              f.write(s)
          print("Enabled android.skip_update = True in buildozer.spec")
          '
            fi
          fi
          find .buildozer -name "build.gradle" -exec sed -i 's/37\.0\.0/33.0.2/g' {} + 2>/dev/null || true

      - name: Compile Pure Python APK (main.py + engine.py + tk_android_bridge.py)
        run: |
          echo "Using JAVA_HOME=$JAVA_HOME"
          java -version
          set +e
          set +o pipefail
          yes | buildozer android debug > buildozer.log 2>&1 &
          BPID=$!
          while kill -0 $BPID 2>/dev/null; do
            grep -E "^# |\[INFO\]|BUILD SUCCESSFUL|FAILURE" buildozer.log | tail -n 3 || true
            sleep 15
          done
          wait $BPID
          BEXIT=$?
          set -e
          set -o pipefail
          echo "Buildozer exited with code $BEXIT"

          # If first run downloaded 37.0.0 because SDK was not cached yet, replace 37.0.0 with 33.0.2 and re-run apk packaging!
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          if ! ls bin/*.apk >/dev/null 2>&1 && [ -d "$SDK_DIR/build-tools/37.0.0" ]; then
            echo "Replacing newly downloaded build-tools 37.0.0 with 33.0.2 and retrying APK packaging..."
            rm -rf "$SDK_DIR/build-tools/34"* "$SDK_DIR/build-tools/35"* "$SDK_DIR/build-tools/36"* "$SDK_DIR/build-tools/37"*
            JAVA8_DIR="${JAVA_HOME_8_X64:-/usr/lib/jvm/temurin-8-jdk-amd64}"
            set +o pipefail
            JAVA_HOME="$JAVA8_DIR" PATH="$JAVA8_DIR/bin:$PATH" yes | "$SDK_DIR/tools/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
            JAVA_HOME="$JAVA8_DIR" PATH="$JAVA8_DIR/bin:$PATH" yes | "$SDK_DIR/tools/bin/sdkmanager" --licenses || true
            set -o pipefail
            find .buildozer -name "build.gradle" -exec sed -i 's/37\.0\.0/33.0.2/g' {} + 2>/dev/null || true
            python -c '
          with open("buildozer.spec", "r") as f:
              s = f.read()
          if "android.skip_update" not in s:
              s = s.replace("android.accept_sdk_license = True", "android.accept_sdk_license = True\nandroid.skip_update = True")
          with open("buildozer.spec", "w") as f:
              f.write(s)
          '
            set +e
            set +o pipefail
            yes | buildozer android debug >> buildozer.log 2>&1
            set -e
            set -o pipefail
          fi

          if ! ls bin/*.apk >/dev/null 2>&1; then
            echo "=== LAST 200 LINES OF BUILDOZER LOG ==="
            tail -n 200 buildozer.log
            exit 1
          fi
          mkdir -p dist_apk
          cp bin/*.apk dist_apk/WS_MasterDuel_PurePython.apk
          ls -lh dist_apk/

      - name: Always Save Buildozer Cache (Even If Interrupted)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer/android/platform
          key: ws-pure-py311-p4a-v7-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WS_MasterDuel_Android_APK
          path: dist_apk/WS_MasterDuel_PurePython.apk
          if-no-files-found: error
