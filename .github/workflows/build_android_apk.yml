name: Build Android APK (WS Master Duel 16x9 Landscape)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Initialize Capacitor Android Project & Lock Landscape Orientation & Maple Icon
        working-directory: ./android_apk_builder
        run: |
          npm install
          npx cap add android
          # Force Landscape orientation in AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Upload Compiled Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WS_MasterDuel_Android_APK
          path: android_apk_builder/android/app/build/outputs/apk/debug/app-debug.apk
