name: Build Pure Python WS Master Duel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 (Required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Clean Non-ASCII Desktop Helper Files & Bundle CJK Font
        run: |
          rm -rf android_apk_builder ws_master_duel_web_mobile.html artifacts
          rm -f *.bat win32_ico_builder.py ws_card_images/*.txt
          python -c '
          import os
          for fn in os.listdir("."):
              if not fn.isascii() and (fn.endswith(".py") or fn.endswith(".bat")):
                  os.remove(fn)
                  print("Removed desktop-only non-ASCII file:", fn)
          '
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake libltdl-dev libjpeg-dev libpng-dev \
            libfreetype6-dev fonts-droid-fallback
          if [ -f "/usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf" ]; then
            cp "/usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf" ./ws_font.ttf
          fi
          python -m pip install --upgrade pip "setuptools<70" "wheel" "cython==0.29.36" "buildozer==1.5.0" virtualenv

      - name: Restore Buildozer Cache (SDK/NDK & Compiled Python 3.11)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer/android/platform
          key: ws-pure-py311-p4a-v8-${{ runner.os }}
          restore-keys: |
            ws-pure-py311-p4a-v8-
            ws-pure-py311-p4a-v7-
            ws-pure-py311-p4a-v6-

      - name: Provision Android SDK 33 & Build-Tools 33.0.2 (Remove 37.0.0)
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/build-tools" "$SDK_DIR/platforms" "$SDK_DIR/licenses"
          # Delete any incompatible 34/35/36/37 build-tools downloaded previously
          rm -rf "$SDK_DIR/build-tools/34"* "$SDK_DIR/build-tools/35"* "$SDK_DIR/build-tools/36"* "$SDK_DIR/build-tools/37"*

          # Use GitHub runner's modern cmdline-tools sdkmanager (Java 17 compatible!) to install exact 33.0.2 + android-33
          SYS_SDK="/usr/local/lib/android/sdk"
          SYS_SDKMGR=$(find "$SYS_SDK" -name "sdkmanager" 2>/dev/null | head -n 1)
          if [ -n "$SYS_SDKMGR" ]; then
            echo "Using system sdkmanager: $SYS_SDKMGR"
            set +o pipefail
            yes | "$SYS_SDKMGR" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
            yes | "$SYS_SDKMGR" --sdk_root="$SDK_DIR" --licenses || true
            set -o pipefail
          fi

          # Also copy licenses from system SDK if present
          if [ -d "$SYS_SDK/licenses" ]; then
            cp -rn "$SYS_SDK/licenses/"* "$SDK_DIR/licenses/" 2>/dev/null || true
          fi

          # Ensure aidl and aapt exist in build-tools/33.0.2
          echo "Installed build-tools in $SDK_DIR/build-tools:"
          ls -la "$SDK_DIR/build-tools/"

          # Fix any cached build.gradle that had 37.0.0 written into it
          find .buildozer -name "build.gradle" -exec sed -i 's/37\.0\.0/33.0.2/g' {} + 2>/dev/null || true

      - name: Compile Pure Python APK (main.py + engine.py + tk_android_bridge.py)
        run: |
          echo "Using JAVA_HOME=$JAVA_HOME"
          java -version
          set +e
          set +o pipefail
          yes | buildozer android debug > buildozer.log 2>&1 &
          BPID=$!
          while kill -0 $BPID 2>/dev/null; do
            grep -E "^# |\[INFO\]|BUILD SUCCESSFUL|FAILURE" buildozer.log | tail -n 3 || true
            sleep 10
          done
          wait $BPID
          BEXIT=$?
          set -e
          set -o pipefail
          echo "Buildozer exited with code $BEXIT"

          if ! ls bin/*.apk >/dev/null 2>&1; then
            echo "=== ACTUAL ERROR LOG (EXCLUDING # ENVIRONMENT DUMP) ==="
            grep -v "^#     " buildozer.log | tail -n 180
            exit 1
          fi
          mkdir -p dist_apk
          cp bin/*.apk dist_apk/WS_MasterDuel_PurePython.apk
          ls -lh dist_apk/

      - name: Always Save Buildozer Cache (Even If Interrupted)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer/android/platform
          key: ws-pure-py311-p4a-v8-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WS_MasterDuel_Android_APK
          path: dist_apk/WS_MasterDuel_PurePython.apk
          if-no-files-found: error
